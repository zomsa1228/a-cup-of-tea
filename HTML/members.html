<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FC Portal — メンバー一覧</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.3.2/mdb.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container-fluid px-3">
    <a class="navbar-brand" href="../index.html">⚔ <span>FC</span> Portal</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
      data-bs-target="#navMenu" aria-controls="navMenu"
      aria-expanded="false" aria-label="メニューを開く">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" data-page="index.html"   href="../index.html">🏠 ホーム</a></li>
        <li class="nav-item"><a class="nav-link" data-page="members.html" href="members.html">👥 メンバー</a></li>
        <li class="nav-item"><a class="nav-link" data-page="rules.html"   href="rules.html">📜 ルール</a></li>
        <li class="nav-item"><a class="nav-link" data-page="discord.html" href="discord.html">💬 Discord</a></li>
        <li class="nav-item"><a class="nav-link" data-page="links.html"   href="links.html">🔗 リンク集</a></li>
        <li class="nav-item"><a class="nav-link" data-page="events.html"  href="events.html">📅 イベント</a></li>
        <li class="nav-item"><a class="nav-link" data-page="stream.html"  href="stream.html">🎮 配信</a></li>
        <li class="nav-item"><a class="nav-link" data-page="memo.html"    href="memo.html">📖 攻略メモ</a></li>
        <li class="nav-item"><a class="nav-link" data-page="faq.html"     href="faq.html">❓ FAQ</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="page-wrap">
  <div class="section-heading"><h2>👥 メンバー一覧</h2></div>

  <!-- ============================================================
       ローディング表示（プログレスバー1本・ページ開いたら自動開始）
       loadMembers() によって進捗が更新される
  ============================================================ -->
  <div id="member-loading" class="content-loader" style="display:none">
    <div class="content-loader-bar-wrap">
      <div class="progress">
        <div id="member-progress-bar" class="progress-bar" role="progressbar"
             style="width:0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
        </div>
      </div>
    </div>
    <div id="member-progress-text" class="content-loader-text">
      メンバーデータを取得中...
    </div>
  </div>

  <!-- エラー表示 -->
  <div id="member-error" class="alert alert-danger d-flex align-items-center gap-2"
       style="display:none" role="alert">
    <span>⚠</span>
    <span id="member-error-msg" class="flex-grow-1"></span>
    <button class="btn btn-outline-danger btn-sm" onclick="loadMembers()">再試行</button>
  </div>

  <!-- メンバーリスト（取得完了後に表示） -->
  <div id="member-list" style="display:none">

    <!-- ============================================================
         操作コントロール
         ★ ソートの選択肢を変えたい場合は <option> を編集
    ============================================================ -->
    <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
      <input type="text" class="form-control" id="member-filter"
        placeholder="🔍 名前・ジョブ・ランクで絞り込み"
        oninput="renderMembers()" style="max-width:280px">
      <select class="form-select" id="member-sort" onchange="renderMembers()" style="width:auto">
        <option value="rank">ランク順</option>
        <option value="name">名前順</option>
        <option value="job">ジョブ順</option>
      </select>
      <button class="btn btn-outline-primary btn-sm" onclick="exportCSV()">📥 CSV出力</button>
      <button class="btn btn-outline-secondary btn-sm" onclick="loadMembers()">🔄 再取得</button>
    </div>

    <p id="member-count" class="text-secondary mb-3" style="font-size:0.8rem"></p>
    <div id="member-output"></div>
  </div>

</main>

<footer>
  <p>© 2025 FC Portal — Final Fantasy XIV Free Company Site</p>
  <p>FINAL FANTASY XIV © 2010-2025 SQUARE ENIX CO., LTD. All Rights Reserved.</p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.3.2/mdb.umd.min.js"></script>
<script src="../script/main.js"></script>
<script src="../script/lodestone.js"></script>
<script>
  // ページを開いたら自動でメンバー取得開始
  document.addEventListener('DOMContentLoaded', () => { loadMembers(); });
</script>
</body>
</html>
